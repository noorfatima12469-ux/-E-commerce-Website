<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">ShopEasy</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html" class="active">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <h2 class="page-title">All Category Products</h2>

    <div class="product-grid">
        <!-- Chocolates -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1511381939415-e44015466834?w=400" alt="Chocolate">
            <h3>Dark Chocolate</h3>
            <p class="price">$10.00</p>
            <button class="add-btn">Add to Cart</button>
        </div>

        <!-- Grocery -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=400" alt="Grocery">
            <h3>Fresh Grocery Pack</h3>
            <p class="price">$25.00</p>
            <button class="add-btn">Add to Cart</button>
        </div>

        <!-- Kids -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?w=400" alt="Kids Toys">
            <h3>Kids Toys Pack</h3>
            <p class="price">$15.00</p>
            <button class="add-btn">Add to Cart</button>
        </div>

        <!-- Makeup -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=400" alt="Makeup">
            <h3>Beauty Makeup Kit</h3>
            <p class="price">$30.00</p>
            <button class="add-btn">Add to Cart</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ShopEasy Store. All Rights Reserved.</p>
    </footer>

    <script src="products.js"></script>
</body>
</html>
